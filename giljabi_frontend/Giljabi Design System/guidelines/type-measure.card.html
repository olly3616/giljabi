<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;font-family:var(--font-core);background:var(--surface-page);color:var(--text-primary)}</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
<div style="padding:16px;border-radius:16px;background:#fff;border:2px solid var(--green-500)"><div style="font-size:12px;font-weight:700;color:var(--text-success);margin-bottom:8px">좋은 예</div><p style="margin:0;font-size:var(--font-size-guide);font-weight:600;line-height:1.45;max-width:var(--text-measure)">화면 아래 승차권 예매를 눌러주세요.</p></div>
<div style="padding:16px;border-radius:16px;background:#fff;border:2px solid var(--red-500)"><div style="font-size:12px;font-weight:700;color:var(--text-danger);margin-bottom:8px">나쁜 예</div><p style="margin:0;font-size:16px;line-height:1.4;color:var(--neutral-600)">하단 내비게이션 바의 예매 탭을 선택한 후 출발지와 도착지를 입력하고 조회 버튼을 탭하세요.</p></div>
</div></body></html>
