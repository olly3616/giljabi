<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;width:1280px;height:854px}
.wrap{display:flex;width:1280px;height:854px}
.main{flex:1;background:var(--blue-600);display:flex;align-items:center;justify-content:center}
.mark{font-family:var(--font-core);font-weight:800;font-size:230px;letter-spacing:-.03em;color:#fff;line-height:1;white-space:nowrap}
.strip{width:320px;display:flex;flex-direction:column}
.strip span{flex:1;display:block}</style></head>
<body><div class="wrap"><div class="main"><div class="mark">길잡이</div></div>
<div class="strip"><span style="background:var(--amber-300)"></span><span style="background:var(--amber-500)"></span><span style="background:var(--green-500)"></span><span style="background:var(--blue-900)"></span></div></div></body></html>
