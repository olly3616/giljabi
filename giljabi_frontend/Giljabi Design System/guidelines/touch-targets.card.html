<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;font-family:var(--font-core);background:var(--surface-page);color:var(--text-primary)}</style></head><body>
<div style="display:flex;align-items:flex-end;gap:20px">
<div style="display:flex;flex-direction:column;gap:8px"><div style="width:190px;height:var(--touch-min);border-radius:16px;background:var(--blue-600);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700">48dp</div><div style="font-size:12px;color:var(--text-secondary)">최소 — 부가 조작만</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="width:190px;height:var(--touch-comfortable);border-radius:16px;background:var(--blue-600);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700">64dp</div><div style="font-size:12px;color:var(--text-secondary)">권장 — 일반 버튼</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="width:190px;height:var(--touch-hero);border-radius:16px;background:var(--blue-600);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700">80dp</div><div style="font-size:12px;color:var(--text-secondary)">대표 행동·목표 카드</div></div>
</div></body></html>
